name: Convert TV Mode Screenshots to PNG

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/convert-tv-mode-png.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert full-resolution TV Mode screenshots to PNG
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          root = Path("docs/screenshots")
          images = {
              "tv-mode-live-tv-epg-v3.jpg": "tv-mode-live-tv-epg.png",
              "tv-mode-movies-v2.jpg": "tv-mode-movies.png",
              "tv-mode-series-v2.jpg": "tv-mode-series.png",
          }

          for source_name, output_name in images.items():
              source = root / source_name
              output = root / output_name
              if not source.exists():
                  raise FileNotFoundError(source)
              with Image.open(source) as image:
                  image = image.convert("RGB")
                  image.save(output, format="PNG", optimize=True)
                  print(f"{source_name}: {image.width}x{image.height} -> {output_name}")

      - name: Commit PNG screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/tv-mode-live-tv-epg.png docs/screenshots/tv-mode-movies.png docs/screenshots/tv-mode-series.png
          if git diff --cached --quiet; then
            echo "PNG screenshots already current."
            exit 0
          fi
          git commit -m "Add sharp TV Mode PNG screenshots [skip ci]"
          git push
