name: BLAZIN Sales Check

on:
  workflow_dispatch:
    inputs:
      notify_even_if_no_new_sales:
        description: "Send Telegram message even if no new activity?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  check-sales:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Microsoft Store sales
        shell: bash
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_APP_ID: ${{ secrets.MS_APP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ inputs.notify_even_if_no_new_sales || 'false' }}
        run: |
          set -e
          mkdir -p .github/state

          python3 <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone

          STATE_FILE = ".github/state/blazin_sales_state.json"

          tenant_id = os.environ["MS_TENANT_ID"]
          client_id = os.environ["MS_CLIENT_ID"]
          client_secret = os.environ["MS_CLIENT_SECRET"]
          app_id = os.environ["MS_APP_ID"]
          telegram_token = os.environ["TELEGRAM_BOT_TOKEN"]
          telegram_chat_id = os.environ["TELEGRAM_CHAT_ID"]
          force_notify = os.environ.get("FORCE_NOTIFY", "false").lower() == "true"

          def ms_date(dt):
              return f"{dt.month}/{dt.day}/{dt.year}"

          def post_form(url, data, headers=None):
              encoded = urllib.parse.urlencode(data).encode("utf-8")
              req = urllib.request.Request(url, data=encoded, headers=headers or {}, method="POST")
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read().decode("utf-8")

          def get_json(url, token):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/json"}, method="GET")
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def send_telegram(text):
              post_form(f"https://api.telegram.org/bot{telegram_token}/sendMessage", {"chat_id": telegram_chat_id, "text": text})

          def load_state():
              if not os.path.exists(STATE_FILE):
                  return {}
              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  return json.load(f)

          def save_state(state):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(state, f, indent=2, sort_keys=True)

          def qty(row):
              return int(row.get("acquisitionQuantity") or 0)

          def usd(row):
              return float(row.get("purchasePriceUSDAmount") or 0)

          def local(row):
              return float(row.get("purchasePriceLocalAmount") or 0)

          def acq_type(row):
              return str(row.get("acquisitionType", "")).strip().lower()

          def is_paid(row):
              return usd(row) > 0 or local(row) > 0 or acq_type(row) in {"paid", "purchase", "initial purchase", "in-app purchase", "app purchase"}

          def is_trial(row):
              return acq_type(row) == "trial"

          now = datetime.now(timezone.utc)
          today_key = now.strftime("%Y-%m-%d")

          token_raw = post_form(
              f"https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token",
              {
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "scope": "https://manage.devcenter.microsoft.com/.default",
                  "grant_type": "client_credentials",
              },
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )

          token = json.loads(token_raw).get("access_token")
          if not token:
              raise SystemExit("Failed to get Microsoft access token.")

          query = {
              "applicationId": app_id,
              "startDate": ms_date(now),
              "endDate": ms_date(now),
              "aggregationLevel": "day",
              "groupby": "date,applicationName,acquisitionType,market,deviceType,storeClient,osVersion",
          }

          data = get_json("https://manage.devcenter.microsoft.com/v1.0/my/analytics/acquisitions?" + urllib.parse.urlencode(query), token)
          rows = data.get("Value") or data.get("value") or []

          paid_rows = [r for r in rows if is_paid(r)]
          trial_rows = [r for r in rows if is_trial(r)]

          paid_today = sum(qty(r) for r in paid_rows)
          trials_today = sum(qty(r) for r in trial_rows)
          total_today = sum(qty(r) for r in rows)
          gross_today = round(sum(usd(r) for r in paid_rows), 2)

          state = load_state()
          old_paid = int(state.get("paid_today", 0)) if state.get("date") == today_key else 0
          old_gross = float(state.get("gross_today", 0)) if state.get("date") == today_key else 0.0
          old_trials = int(state.get("trials_today", 0)) if state.get("date") == today_key else 0

          new_paid = max(0, paid_today - old_paid)
          new_gross = round(max(0.0, gross_today - old_gross), 2)
          new_trials = max(0, trials_today - old_trials)

          save_state({
              "date": today_key,
              "last_checked": now.isoformat(),
              "paid_today": paid_today,
              "gross_today": gross_today,
              "trials_today": trials_today,
              "total_today": total_today,
          })

          print("Paid today:", paid_today)
          print("Gross today:", gross_today)
          print("Trials today:", trials_today)
          print("Total acquisitions today:", total_today)
          print("New paid:", new_paid)
          print("New gross:", new_gross)

          if new_paid > 0 or new_gross > 0:
              send_telegram(
                  "🔥 NEW BLAZIN IPTV PLAYER PAID SALE!\n\n"
                  f"New paid sales: {new_paid}\n"
                  f"New gross sales: ${new_gross:.2f}\n"
                  f"Paid sales today: {paid_today}\n"
                  f"Gross sales today: ${gross_today:.2f}\n"
                  f"Trials today: {trials_today}\n"
                  f"Total acquisitions today: {total_today}\n"
                  f"Checked: {now.strftime('%Y-%m-%d %H:%M UTC')}"
              )
          elif new_trials > 0:
              send_telegram(
                  "📥 NEW BLAZIN IPTV PLAYER TRIAL!\n\n"
                  f"New trials: {new_trials}\n"
                  f"Trials today: {trials_today}\n"
                  f"Paid sales today: {paid_today}\n"
                  f"Gross sales today: ${gross_today:.2f}\n"
                  f"Total acquisitions today: {total_today}\n"
                  f"Checked: {now.strftime('%Y-%m-%d %H:%M UTC')}"
              )
          elif force_notify:
              send_telegram(
                  "✅ BLAZIN sales check completed.\n\n"
                  "No new activity detected.\n"
                  f"Paid sales today: {paid_today}\n"
                  f"Gross sales today: ${gross_today:.2f}\n"
                  f"Trials today: {trials_today}\n"
                  f"Total acquisitions today: {total_today}\n"
                  f"Checked: {now.strftime('%Y-%m-%d %H:%M UTC')}"
              )
          PY

      - name: Save sales state
        shell: bash
        run: |
          if git diff --quiet .github/state/blazin_sales_state.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/state/blazin_sales_state.json
          git commit -m "Update BLAZIN sales check state"
          git push
