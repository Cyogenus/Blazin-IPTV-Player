name: BLAZIN Sales Check

on:
  workflow_dispatch:
    inputs:
      notify_even_if_no_new_sales:
        description: "Send Telegram message even if no new sales?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: blazin-sales-check
  cancel-in-progress: false

jobs:
  check-sales:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Microsoft Store acquisitions
        shell: bash
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_APP_ID: ${{ secrets.MS_APP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event.inputs.notify_even_if_no_new_sales }}
        run: |
          set -e

          mkdir -p .github/state

          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone

          STATE_FILE = ".github/state/blazin_sales_state.json"

          tenant_id = os.environ["MS_TENANT_ID"]
          client_id = os.environ["MS_CLIENT_ID"]
          client_secret = os.environ["MS_CLIENT_SECRET"]
          app_id = os.environ["MS_APP_ID"]
          telegram_token = os.environ["TELEGRAM_BOT_TOKEN"]
          telegram_chat_id = os.environ["TELEGRAM_CHAT_ID"]
          force_notify = os.environ.get("FORCE_NOTIFY", "false").lower() == "true"

          COUNTRY_NAMES = {
              "US": "United States",
              "CA": "Canada",
              "GB": "United Kingdom",
              "AU": "Australia",
              "DE": "Germany",
              "FR": "France",
              "ES": "Spain",
              "IT": "Italy",
              "NL": "Netherlands",
              "SE": "Sweden",
              "NO": "Norway",
              "DK": "Denmark",
              "FI": "Finland",
              "IE": "Ireland",
              "CH": "Switzerland",
              "AT": "Austria",
              "PL": "Poland",
              "BR": "Brazil",
              "MX": "Mexico",
              "IN": "India",
              "PK": "Pakistan",
              "AF": "Afghanistan",
              "TR": "Turkey",
              "SA": "Saudi Arabia",
              "AE": "United Arab Emirates",
              "ZA": "South Africa",
              "JP": "Japan",
              "KR": "South Korea",
              "CN": "China",
              "TW": "Taiwan",
              "PH": "Philippines",
              "MY": "Malaysia",
              "SG": "Singapore",
              "ID": "Indonesia",
              "TH": "Thailand",
              "VN": "Vietnam",
          }

          PAID_TYPES = {
              "paid",
              "iap",
              "subscription iap",
              "charged pre order",
          }

          FREE_TYPES = {
              "free",
              "trial",
              "promotional code",
              "private audience",
              "pre order",
              "xbox game pass",
              "game pass",
              "disk",
              "prepaid code",
              "cancelled pre order",
              "failed pre order",
          }

          def country_label(code):
              code = str(code or "Unknown").strip().upper()
              if not code or code == "UNKNOWN":
                  return "Unknown"

              name = COUNTRY_NAMES.get(code)
              if name:
                  return f"{name} ({code})"

              return code

          def post_form(url, data, headers=None):
              encoded = urllib.parse.urlencode(data).encode("utf-8")
              req = urllib.request.Request(url, data=encoded, headers=headers or {}, method="POST")

              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.read().decode("utf-8")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {e.code} {e.reason}: {body[:2000]}") from e

          def get_json(url, token):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                  },
                  method="GET",
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {e.code} {e.reason}: {body[:2000]}") from e

          def send_telegram(text):
              url = f"https://api.telegram.org/bot{telegram_token}/sendMessage"
              post_form(url, {
                  "chat_id": telegram_chat_id,
                  "text": text,
              })

          def load_state():
              if not os.path.exists(STATE_FILE):
                  return {
                      "last_paid_total": 0,
                      "last_total_acquisitions": 0,
                      "last_checked": None,
                  }

              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  return json.load(f)

          def save_state(state):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(state, f, indent=2, sort_keys=True)

          def row_quantity(row):
              for key in [
                  "acquisitionQuantity",
                  "AcquisitionQuantity",
                  "quantity",
                  "Quantity",
                  "count",
                  "Count",
              ]:
                  if key in row:
                      try:
                          return int(row.get(key, 0) or 0)
                      except Exception:
                          return 0

              return 0

          def row_price_usd(row):
              for key in [
                  "purchasePriceUSDAmount",
                  "PurchasePriceUSDAmount",
              ]:
                  if key in row:
                      try:
                          return float(row.get(key, 0) or 0)
                      except Exception:
                          return 0.0

              return 0.0

          def row_price_local(row):
              for key in [
                  "purchasePriceLocalAmount",
                  "PurchasePriceLocalAmount",
              ]:
                  if key in row:
                      try:
                          return float(row.get(key, 0) or 0)
                      except Exception:
                          return 0.0

              return 0.0

          def is_paid_row(row):
              acquisition_type = str(row.get("acquisitionType", "") or row.get("AcquisitionType", "")).strip().lower()

              if acquisition_type in PAID_TYPES:
                  return True

              if acquisition_type in FREE_TYPES:
                  return False

              payment_type = str(row.get("paymentInstrumentType", "") or row.get("PaymentInstrumentType", "")).strip().lower()

              if payment_type and payment_type not in {"zero amount paid", "unknown"}:
                  return True

              return row_price_usd(row) > 0 or row_price_local(row) > 0

          def build_acquisitions_url(groupby):
              params = {
                  "applicationId": app_id,
                  "startDate": start_date,
                  "endDate": end_date,
                  "aggregationLevel": "day",
                  "top": 10000,
                  "skip": 0,
              }

              if groupby:
                  params["groupby"] = groupby

              return (
                  "https://manage.devcenter.microsoft.com/v1.0/my/analytics/acquisitions?"
                  + urllib.parse.urlencode(params)
              )

          def fetch_acquisitions(token):
              groupby_attempts = [
                  "date,applicationName,acquisitionType,market,deviceType,storeClient,paymentInstrumentType",
                  "date,applicationName,acquisitionType,market,deviceType,storeClient",
                  "date,acquisitionType,market,paymentInstrumentType",
                  "date,acquisitionType,market",
                  "date,acquisitionType",
                  None,
              ]

              last_error = None

              for groupby in groupby_attempts:
                  try:
                      api_url = build_acquisitions_url(groupby)
                      print("Trying acquisitions groupby:", groupby or "none")

                      first_page = get_json(api_url, token)
                      rows = first_page.get("Value") or first_page.get("value") or []

                      if not isinstance(rows, list):
                          print(json.dumps(first_page, indent=2))
                          raise RuntimeError("Unexpected Microsoft acquisitions response format.")

                      total_count = first_page.get("TotalCount") or first_page.get("totalCount")
                      next_link = first_page.get("@nextLink") or first_page.get("nextLink")

                      while next_link:
                          next_page = get_json(next_link, token)
                          next_rows = next_page.get("Value") or next_page.get("value") or []

                          if isinstance(next_rows, list):
                              rows.extend(next_rows)

                          next_link = next_page.get("@nextLink") or next_page.get("nextLink")

                      return rows, groupby, total_count

                  except Exception as e:
                      last_error = e
                      print("API attempt failed:", str(e))

              raise last_error

          def summarize_markets(rows):
              counts = defaultdict(int)

              for row in rows:
                  market = row.get("market") or row.get("Market") or "Unknown"
                  counts[country_label(market)] += row_quantity(row)

              if not counts:
                  return "Unknown"

              return ", ".join(
                  f"{market}: {count}"
                  for market, count in sorted(counts.items(), key=lambda item: (-item[1], item[0]))
              )

          def summarize_paid_details(rows):
              paid_rows = [row for row in rows if is_paid_row(row)]

              if not paid_rows:
                  return "None"

              lines = []

              for row in paid_rows:
                  qty = row_quantity(row)
                  market = country_label(row.get("market") or row.get("Market") or "Unknown")
                  acquisition_type = row.get("acquisitionType") or row.get("AcquisitionType") or "Unknown"
                  payment_type = row.get("paymentInstrumentType") or row.get("PaymentInstrumentType") or "Unknown"
                  device_type = row.get("deviceType") or row.get("DeviceType") or "Unknown"
                  store_client = row.get("storeClient") or row.get("StoreClient") or "Unknown"
                  date = row.get("date") or row.get("Date") or "Unknown"
                  usd = row_price_usd(row)
                  local = row_price_local(row)

                  if usd > 0:
                      price_text = f"${usd:.2f} USD"
                  elif local > 0:
                      price_text = f"{local:.2f} local amount"
                  else:
                      price_text = "price not reported"

                  lines.append(
                      f"- {qty} paid | {market} | {date} | {device_type} | {store_client} | {payment_type} | {acquisition_type} | {price_text}"
                  )

              return "\n".join(lines)

          now = datetime.now(timezone.utc)
          start = now - timedelta(days=2)

          start_date = start.strftime("%-m/%-d/%Y")
          end_date = now.strftime("%-m/%-d/%Y")
          date_range_text = f"{start.strftime('%Y-%m-%d')} to {now.strftime('%Y-%m-%d')}"

          token_url = f"https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token"

          token_response_raw = post_form(
              token_url,
              {
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "scope": "https://manage.devcenter.microsoft.com/.default",
                  "grant_type": "client_credentials",
              },
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )

          token_response = json.loads(token_response_raw)
          access_token = token_response.get("access_token")

          if not access_token:
              print(json.dumps(token_response, indent=2))
              raise SystemExit("Failed to get Microsoft access token.")

          rows, used_groupby, total_count = fetch_acquisitions(access_token)

          total_acquisitions = sum(row_quantity(row) for row in rows)
          paid_rows = [row for row in rows if is_paid_row(row)]
          paid_total = sum(row_quantity(row) for row in paid_rows)

          state = load_state()
          previous_paid_total = int(state.get("last_paid_total", 0))
          previous_total_acquisitions = int(state.get("last_total_acquisitions", 0))

          new_paid_sales = max(0, paid_total - previous_paid_total)
          new_total_acquisitions = max(0, total_acquisitions - previous_total_acquisitions)

          state = {
              "last_paid_total": paid_total,
              "last_total_acquisitions": total_acquisitions,
              "last_checked": now.isoformat(),
              "date_range_checked_utc": date_range_text,
              "used_endpoint": "acquisitions",
              "used_groupby": used_groupby or "none",
          }

          save_state(state)

          print("Date range checked UTC:", date_range_text)
          print("Used endpoint: acquisitions")
          print("Used groupby:", used_groupby or "none")
          print("TotalCount from API:", total_count)
          print("Rows returned:", len(rows))
          print("Total acquisitions in range:", total_acquisitions)
          print("New total acquisitions detected:", new_total_acquisitions)
          print("Paid sales in range:", paid_total)
          print("Previous paid sales in range:", previous_paid_total)
          print("New paid sales detected:", new_paid_sales)
          print("All acquisition markets:", summarize_markets(rows))
          print("Paid acquisition details:")
          print(summarize_paid_details(rows))
          print("Raw rows:")
          print(json.dumps(rows, indent=2))

          if new_paid_sales > 0:
              message = (
                  "🔥 NEW BLAZIN IPTV PLAYER SALE!\n\n"
                  f"New paid sales detected: {new_paid_sales}\n"
                  f"Paid sales in checked range: {paid_total}\n"
                  f"Total acquisitions in checked range: {total_acquisitions}\n"
                  f"Paid sale details:\n{summarize_paid_details(rows)}\n\n"
                  "Customer name: Not provided by Microsoft Store analytics API.\n"
                  f"Checked: {now.strftime('%Y-%m-%d %H:%M UTC')}"
              )
              send_telegram(message)

          elif force_notify:
              message = (
                  "✅ BLAZIN sales check completed.\n\n"
                  "No new paid sales detected.\n"
                  f"Paid sales in checked range: {paid_total}\n"
                  f"Total acquisitions in checked range: {total_acquisitions}\n"
                  f"All acquisition markets: {summarize_markets(rows)}\n"
                  "Customer name: Not provided by Microsoft Store analytics API.\n"
                  f"Checked: {now.strftime('%Y-%m-%d %H:%M UTC')}"
              )
              send_telegram(message)

          PY

      - name: Save sales state
        shell: bash
        run: |
          if git diff --quiet -- .github/state/blazin_sales_state.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/state/blazin_sales_state.json
          git commit -m "Update BLAZIN sales check state"
          git push