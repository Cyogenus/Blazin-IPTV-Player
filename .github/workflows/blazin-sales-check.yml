name: BLAZIN Sales Check

on:
  workflow_dispatch:
    inputs:
      notify_even_if_no_new_sales:
        description: "Send Telegram message even if no new sales?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: blazin-sales-check
  cancel-in-progress: false

jobs:
  check-sales:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Microsoft Store acquisitions
        shell: bash
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_APP_ID: ${{ secrets.MS_APP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event.inputs.notify_even_if_no_new_sales }}
        run: |
          set -e

          mkdir -p .github/state

          python3 <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          STATE_FILE = ".github/state/blazin_sales_state.json"

          tenant_id = os.environ["MS_TENANT_ID"]
          client_id = os.environ["MS_CLIENT_ID"]
          client_secret = os.environ["MS_CLIENT_SECRET"]
          app_id = os.environ["MS_APP_ID"]
          telegram_token = os.environ["TELEGRAM_BOT_TOKEN"]
          telegram_chat_id = os.environ["TELEGRAM_CHAT_ID"]
          force_notify = os.environ.get("FORCE_NOTIFY", "false").lower() == "true"

          PAID_TYPES = {
              "paid",
              "iap",
              "subscription iap",
              "charged pre order",
          }

          FREE_TYPES = {
              "free",
              "trial",
              "promotional code",
              "private audience",
              "pre order",
              "xbox game pass",
              "game pass",
              "disk",
              "prepaid code",
              "cancelled pre order",
              "failed pre order",
          }

          ZERO_PAYMENT_TYPES = {
              "",
              "unknown",
              "zero amount paid",
              "free",
              "no charge",
              "trial",
          }

          COUNTRY_NAMES = {
              "US": "United States",
              "BD": "Bangladesh",
              "FR": "France",
              "GR": "Greece",
              "DE": "Germany",
              "IT": "Italy",
              "VU": "Vanuatu",
              "CA": "Canada",
              "GB": "United Kingdom",
              "AU": "Australia",
              "IN": "India",
              "PK": "Pakistan",
              "TR": "Turkey",
              "NL": "Netherlands",
              "ES": "Spain",
              "BR": "Brazil",
              "MX": "Mexico",
          }

          def clean_text(value):
              return str(value or "").strip()

          def lower_text(value):
              return clean_text(value).lower()

          def format_mdy(dt):
              return f"{dt.month}/{dt.day}/{dt.year}"

          def country_label(code):
              code = clean_text(code).upper()
              if not code:
                  return "Unknown"
              name = COUNTRY_NAMES.get(code)
              if name:
                  return f"{name} ({code})"
              return code

          def post_form(url, data, headers=None):
              encoded = urllib.parse.urlencode(data).encode("utf-8")
              req = urllib.request.Request(url, data=encoded, headers=headers or {}, method="POST")

              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.read().decode("utf-8")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {e.code} {e.reason}: {body[:2000]}") from e

          def get_json(url, token):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                  },
                  method="GET",
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {e.code} {e.reason}: {body[:2000]}") from e

          def send_telegram(text):
              url = f"https://api.telegram.org/bot{telegram_token}/sendMessage"
              post_form(url, {
                  "chat_id": telegram_chat_id,
                  "text": text,
              })

          def load_state():
              if not os.path.exists(STATE_FILE):
                  return {
                      "seen_paid_row_quantities": {},
                      "last_checked": None,
                  }

              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  state = json.load(f)

              if "seen_paid_row_quantities" not in state:
                  state["seen_paid_row_quantities"] = {}

              return state

          def save_state(state):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(state, f, indent=2, sort_keys=True)

          def row_quantity(row):
              for key in [
                  "acquisitionQuantity",
                  "AcquisitionQuantity",
                  "quantity",
                  "Quantity",
                  "count",
                  "Count",
              ]:
                  if key in row:
                      try:
                          return int(float(row.get(key) or 0))
                      except Exception:
                          return 0
              return 0

          def row_float(row, keys):
              for key in keys:
                  if key in row:
                      try:
                          raw = clean_text(row.get(key)).replace(",", "").replace("$", "")
                          return float(raw or 0)
                      except Exception:
                          return 0.0
              return 0.0

          def row_price_usd(row):
              return row_float(row, ["purchasePriceUSDAmount", "PurchasePriceUSDAmount"])

          def row_price_local(row):
              return row_float(row, ["purchasePriceLocalAmount", "PurchasePriceLocalAmount"])

          def row_market(row):
              return clean_text(row.get("market") or row.get("Market") or "Unknown")

          def row_acquisition_type(row):
              return clean_text(row.get("acquisitionType") or row.get("AcquisitionType"))

          def row_payment_type(row):
              return clean_text(row.get("paymentInstrumentType") or row.get("PaymentInstrumentType"))

          def row_date_text(row):
              return clean_text(row.get("date") or row.get("Date"))

          def parse_row_date(row):
              value = row_date_text(row)
              if not value:
                  return None

              for fmt in ("%Y-%m-%d", "%m/%d/%Y", "%-m/%-d/%Y"):
                  try:
                      return datetime.strptime(value[:10], fmt).date()
                  except Exception:
                      pass

              return None

          def is_paid_row(row):
              qty = row_quantity(row)
              if qty <= 0:
                  return False

              acquisition_type = lower_text(row_acquisition_type(row))
              payment_type = lower_text(row_payment_type(row))

              if acquisition_type in PAID_TYPES:
                  return True

              if acquisition_type in FREE_TYPES:
                  return False

              if row_price_usd(row) > 0 or row_price_local(row) > 0:
                  return True

              if payment_type not in ZERO_PAYMENT_TYPES:
                  return True

              return False

          def row_fingerprint(row):
              parts = {
                  "date": row_date_text(row),
                  "applicationId": clean_text(row.get("applicationId") or row.get("ApplicationId")),
                  "applicationName": clean_text(row.get("applicationName") or row.get("ApplicationName")),
                  "acquisitionType": row_acquisition_type(row),
                  "market": row_market(row),
                  "paymentInstrumentType": row_payment_type(row),
                  "deviceType": clean_text(row.get("deviceType") or row.get("DeviceType")),
                  "storeClient": clean_text(row.get("storeClient") or row.get("StoreClient")),
                  "osVersion": clean_text(row.get("osVersion") or row.get("OsVersion")),
                  "purchasePriceUSDAmount": clean_text(row.get("purchasePriceUSDAmount") or row.get("PurchasePriceUSDAmount")),
                  "purchasePriceLocalAmount": clean_text(row.get("purchasePriceLocalAmount") or row.get("PurchasePriceLocalAmount")),
              }

              raw = json.dumps(parts, sort_keys=True)
              return hashlib.sha1(raw.encode("utf-8")).hexdigest()

          def build_acquisitions_url(start_date, end_date, groupby, skip=0):
              params = {
                  "applicationId": app_id,
                  "startDate": start_date,
                  "endDate": end_date,
                  "aggregationLevel": "day",
                  "top": 10000,
                  "skip": skip,
              }

              if groupby:
                  params["groupby"] = groupby

              return (
                  "https://manage.devcenter.microsoft.com/v1.0/my/analytics/acquisitions?"
                  + urllib.parse.urlencode(params)
              )

          def fetch_acquisitions(token, start_date, end_date):
              groupby_attempts = [
                  "date,applicationName,acquisitionType,market,deviceType,storeClient,paymentInstrumentType,osVersion",
                  "date,applicationName,acquisitionType,market,deviceType,storeClient,paymentInstrumentType",
                  "date,acquisitionType,market,paymentInstrumentType",
                  "date,acquisitionType,market",
                  "date,acquisitionType",
                  None,
              ]

              last_error = None

              for groupby in groupby_attempts:
                  try:
                      print("Trying groupby:", groupby or "none")

                      all_rows = []
                      skip = 0

                      while True:
                          api_url = build_acquisitions_url(start_date, end_date, groupby, skip=skip)
                          data = get_json(api_url, token)

                          rows = data.get("Value") or data.get("value") or []
                          if not isinstance(rows, list):
                              print(json.dumps(data, indent=2))
                              raise RuntimeError("Unexpected Microsoft acquisitions response format.")

                          all_rows.extend(rows)

                          total_count = int(data.get("TotalCount") or data.get("totalCount") or len(all_rows))
                          if len(all_rows) >= total_count or not rows:
                              break

                          skip += 10000

                      return all_rows, groupby

                  except Exception as e:
                      last_error = e
                      print("API attempt failed:", str(e))

              raise last_error

          def summarize_markets(rows):
              counts = defaultdict(int)

              for row in rows:
                  market = country_label(row_market(row))
                  counts[market] += row_quantity(row)

              if not counts:
                  return "Unknown"

              return ", ".join(
                  f"{market}: {count}"
                  for market, count in sorted(counts.items(), key=lambda item: (-item[1], item[0]))
              )

          def summarize_paid_details(rows):
              paid_rows = [row for row in rows if is_paid_row(row)]

              if not paid_rows:
                  return "None"

              lines = []

              for row in paid_rows:
                  qty = row_quantity(row)
                  market = country_label(row_market(row))
                  acquisition_type = row_acquisition_type(row) or "Unknown"
                  payment_type = row_payment_type(row) or "Unknown"
                  device_type = clean_text(row.get("deviceType") or row.get("DeviceType") or "Unknown")
                  store_client = clean_text(row.get("storeClient") or row.get("StoreClient") or "Unknown")
                  date = row_date_text(row) or "Unknown"
                  usd = row_price_usd(row)
                  local = row_price_local(row)

                  if usd > 0:
                      price_text = f"${usd:.2f} USD"
                  elif local > 0:
                      price_text = f"{local:.2f} local amount"
                  else:
                      price_text = "price not reported"

                  lines.append(
                      f"- {qty} paid | {market} | {date} | {payment_type} | {acquisition_type} | {device_type} | {store_client} | {price_text}"
                  )

              return "\n".join(lines)

          def summarize_new_paid_details(new_details):
              if not new_details:
                  return "None"

              lines = []

              for item in new_details:
                  row = item["row"]
                  delta = item["delta"]

                  market = country_label(row_market(row))
                  acquisition_type = row_acquisition_type(row) or "Unknown"
                  payment_type = row_payment_type(row) or "Unknown"
                  device_type = clean_text(row.get("deviceType") or row.get("DeviceType") or "Unknown")
                  store_client = clean_text(row.get("storeClient") or row.get("StoreClient") or "Unknown")
                  date = row_date_text(row) or "Unknown"
                  usd = row_price_usd(row)
                  local = row_price_local(row)

                  if usd > 0:
                      price_text = f"${usd:.2f} USD"
                  elif local > 0:
                      price_text = f"{local:.2f} local amount"
                  else:
                      price_text = "price not reported"

                  lines.append(
                      f"- {delta} new sale(s) | {market} | {date} | {payment_type} | {acquisition_type} | {device_type} | {store_client} | {price_text}"
                  )

              return "\n".join(lines)

          now_utc = datetime.now(timezone.utc)
          now_pt = datetime.now(ZoneInfo("America/Los_Angeles"))
          today_pt = now_pt.date()

          start_pt = today_pt - timedelta(days=2)
          end_utc = now_utc.date()

          start_date = format_mdy(datetime(start_pt.year, start_pt.month, start_pt.day))
          end_date = format_mdy(datetime(end_utc.year, end_utc.month, end_utc.day))

          token_url = f"https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token"

          token_response_raw = post_form(
              token_url,
              {
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "scope": "https://manage.devcenter.microsoft.com/.default",
                  "grant_type": "client_credentials",
              },
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )

          token_response = json.loads(token_response_raw)
          access_token = token_response.get("access_token")

          if not access_token:
              print(json.dumps(token_response, indent=2))
              raise SystemExit("Failed to get Microsoft access token.")

          rows, used_groupby = fetch_acquisitions(access_token, start_date, end_date)

          total_acquisitions = sum(row_quantity(row) for row in rows)
          paid_rows = [row for row in rows if is_paid_row(row)]
          paid_total = sum(row_quantity(row) for row in paid_rows)

          today_pt_rows = [
              row for row in rows
              if parse_row_date(row) == today_pt
          ]
          today_pt_paid_rows = [
              row for row in today_pt_rows
              if is_paid_row(row)
          ]

          total_today_pt = sum(row_quantity(row) for row in today_pt_rows)
          paid_today_pt = sum(row_quantity(row) for row in today_pt_paid_rows)

          state = load_state()
          seen_paid_row_quantities = state.get("seen_paid_row_quantities", {})

          current_paid_quantities = defaultdict(int)
          row_by_fingerprint = {}

          for row in paid_rows:
              fingerprint = row_fingerprint(row)
              current_paid_quantities[fingerprint] += row_quantity(row)
              row_by_fingerprint[fingerprint] = row

          new_paid_sales = 0
          new_paid_details = []

          for fingerprint, qty in current_paid_quantities.items():
              previous_qty = int(seen_paid_row_quantities.get(fingerprint, 0) or 0)
              delta = max(0, qty - previous_qty)

              if delta > 0:
                  new_paid_sales += delta
                  new_paid_details.append({
                      "delta": delta,
                      "row": row_by_fingerprint[fingerprint],
                  })

              seen_paid_row_quantities[fingerprint] = max(previous_qty, qty)

          if len(seen_paid_row_quantities) > 5000:
              seen_paid_row_quantities = dict(list(seen_paid_row_quantities.items())[-5000:])

          state = {
              "last_checked": now_utc.isoformat(),
              "date_range_checked": f"{start_date} to {end_date}",
              "today_pacific": today_pt.isoformat(),
              "used_endpoint": "v1.0/my/analytics/acquisitions",
              "used_groupby": used_groupby or "none",
              "paid_total_in_range": paid_total,
              "total_acquisitions_in_range": total_acquisitions,
              "paid_today_pacific_date": paid_today_pt,
              "total_today_pacific_date": total_today_pt,
              "seen_paid_row_quantities": seen_paid_row_quantities,
          }

          save_state(state)

          print("Endpoint used: v1.0/my/analytics/acquisitions")
          print("Date range checked:", state["date_range_checked"])
          print("Today Pacific date:", state["today_pacific"])
          print("Used groupby:", used_groupby or "none")
          print("Rows returned:", len(rows))
          print("Total acquisitions in checked range:", total_acquisitions)
          print("Paid sales in checked range:", paid_total)
          print("Total acquisitions for today's Pacific date:", total_today_pt)
          print("Paid sales for today's Pacific date:", paid_today_pt)
          print("New paid sales detected:", new_paid_sales)
          print("All acquisition markets:", summarize_markets(rows))
          print("All paid sale details:")
          print(summarize_paid_details(rows))
          print("New paid sale details:")
          print(summarize_new_paid_details(new_paid_details))
          print("Raw rows:")
          print(json.dumps(rows, indent=2))

          if new_paid_sales > 0:
              message = (
                  "🔥 NEW BLAZIN IPTV PLAYER SALE!\n\n"
                  f"New paid sales detected: {new_paid_sales}\n"
                  f"Paid sales for today's Pacific date: {paid_today_pt}\n"
                  f"Paid sales in checked range: {paid_total}\n"
                  f"Total acquisitions for today's Pacific date: {total_today_pt}\n"
                  f"Total acquisitions in checked range: {total_acquisitions}\n\n"
                  f"New paid sale details:\n{summarize_new_paid_details(new_paid_details)}\n\n"
                  "Customer name: Not provided by Microsoft Store analytics API.\n"
                  f"Checked: {now_utc.strftime('%Y-%m-%d %H:%M UTC')}"
              )
              send_telegram(message)

          elif force_notify:
              message = (
                  "✅ BLAZIN sales check completed.\n\n"
                  "No new paid sales detected.\n"
                  f"Paid sales for today's Pacific date: {paid_today_pt}\n"
                  f"Paid sales in checked range: {paid_total}\n"
                  f"Total acquisitions for today's Pacific date: {total_today_pt}\n"
                  f"Total acquisitions in checked range: {total_acquisitions}\n"
                  f"All acquisition markets: {summarize_markets(rows)}\n"
                  "Customer name: Not provided by Microsoft Store analytics API.\n"
                  f"Checked: {now_utc.strftime('%Y-%m-%d %H:%M UTC')}"
              )
              send_telegram(message)

          PY

      - name: Save sales state
        shell: bash
        run: |
          if git diff --quiet -- .github/state/blazin_sales_state.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/state/blazin_sales_state.json
          git commit -m "Update BLAZIN sales check state"
          git push