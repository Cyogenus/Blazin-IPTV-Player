name: BLAZIN Sales Check

on:
  workflow_dispatch:
    inputs:
      notify_even_if_no_new_sales:
        description: "Send Telegram message even if no new sales?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: blazin-sales-check
  cancel-in-progress: false

jobs:
  check-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Microsoft Store sales report
        shell: bash
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_APP_ID: ${{ secrets.MS_APP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event.inputs.notify_even_if_no_new_sales }}
        run: |
          set -e

          mkdir -p .github/state

          python3 <<'PY'
          import csv
          import hashlib
          import io
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone

          STATE_FILE = ".github/state/blazin_sales_state.json"

          tenant_id = os.environ["MS_TENANT_ID"]
          client_id = os.environ["MS_CLIENT_ID"]
          client_secret = os.environ["MS_CLIENT_SECRET"]
          app_id = os.environ["MS_APP_ID"].strip()
          telegram_token = os.environ["TELEGRAM_BOT_TOKEN"]
          telegram_chat_id = os.environ["TELEGRAM_CHAT_ID"]
          force_notify = os.environ.get("FORCE_NOTIFY", "false").lower() == "true"

          BASE_URL = "https://manage.devcenter.microsoft.com"
          QUERY_NAME = "BLAZIN_SALES_PURCHASE_QUANTITY_V1"

          SALES_QUERY = (
              "SELECT "
              "TitleId, ProductId, XboxProductId, ProductTypeName, TitleName, "
              "CatalogId, SandboxId, SkuId, SkuTypeName, SkuDisplayName, "
              "AvailabilityId, RegionName, CountryName, Market, PaymentType, "
              "StoreClientName, StoreClientCategory, AcquisitionType, PurchaseTaxType, "
              "LocalCurrencyCode, SupportedPlatform, Age, Gender, OsVersion, DeviceType, "
              "DateStamp, PurchaseQuantity, PurchasePriceUSDAmount, PurchaseTaxUSDAmount, "
              "PurchasePriceLocalAmount, PurchaseTaxLocalAmount "
              "FROM Acquisitions "
              "WHERE ProductId IN ('all') "
              "TIMESPAN LAST_72_HOURS "
              "AGGREGATED Hourly"
          )

          PAID_TYPES = {
              "paid",
              "iap",
              "subscription iap",
              "charged pre order",
          }

          FREE_TYPES = {
              "free",
              "trial",
              "promotional code",
              "private audience",
              "pre order",
              "xbox game pass",
              "game pass",
              "disk",
              "prepaid code",
              "cancelled pre order",
              "failed pre order",
          }

          ZERO_PAYMENT_TYPES = {
              "",
              "unknown",
              "zero amount paid",
              "free",
              "no charge",
              "trial",
          }

          def clean_text(value):
              return str(value or "").strip()

          def lower_text(value):
              return clean_text(value).lower()

          def post_form(url, data, headers=None):
              encoded = urllib.parse.urlencode(data).encode("utf-8")
              req = urllib.request.Request(url, data=encoded, headers=headers or {}, method="POST")

              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.read().decode("utf-8")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {e.code} {e.reason}: {body[:2000]}") from e

          def get_json(url, token):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                  },
                  method="GET",
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {e.code} {e.reason}: {body[:2000]}") from e

          def post_json(url, token, payload):
              body = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=body,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {e.code} {e.reason}: {body[:2000]}") from e

          def download_text(url):
              req = urllib.request.Request(url, method="GET")

              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return response.read().decode("utf-8-sig", errors="replace")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {e.code} {e.reason}: {body[:2000]}") from e

          def send_telegram(text):
              url = f"https://api.telegram.org/bot{telegram_token}/sendMessage"
              post_form(url, {
                  "chat_id": telegram_chat_id,
                  "text": text,
              })

          def load_state():
              if not os.path.exists(STATE_FILE):
                  return {
                      "seen_paid_row_quantities": {},
                      "last_checked": None,
                  }

              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  state = json.load(f)

              if "seen_paid_row_quantities" not in state:
                  state["seen_paid_row_quantities"] = {}

              return state

          def save_state(state):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(state, f, indent=2, sort_keys=True)

          def row_int(row, key):
              try:
                  return int(float(clean_text(row.get(key, "0")) or 0))
              except Exception:
                  return 0

          def row_float(row, key):
              try:
                  raw = clean_text(row.get(key, "0")).replace(",", "").replace("$", "")
                  return float(raw or 0)
              except Exception:
                  return 0.0

          def purchase_quantity(row):
              return row_int(row, "PurchaseQuantity")

          def usd_amount(row):
              return row_float(row, "PurchasePriceUSDAmount")

          def local_amount(row):
              return row_float(row, "PurchasePriceLocalAmount")

          def is_paid_sale_row(row):
              qty = purchase_quantity(row)

              if qty <= 0:
                  return False

              acquisition_type = lower_text(row.get("AcquisitionType"))
              payment_type = lower_text(row.get("PaymentType"))

              if usd_amount(row) > 0 or local_amount(row) > 0:
                  return True

              if acquisition_type in PAID_TYPES:
                  return True

              if acquisition_type in FREE_TYPES:
                  return False

              if payment_type not in ZERO_PAYMENT_TYPES:
                  return True

              return False

          def row_country(row):
              country = clean_text(row.get("CountryName"))
              market = clean_text(row.get("Market"))

              if country and market:
                  return f"{country} ({market})"

              if country:
                  return country

              if market:
                  return market

              return "Unknown"

          def row_product_matches_app(row):
              wanted = app_id.upper()

              for key in ["ProductId", "TitleId", "XboxProductId"]:
                  value = clean_text(row.get(key)).upper()
                  if value == wanted:
                      return True

              return False

          def row_fingerprint(row):
              parts = {
                  "DateStamp": clean_text(row.get("DateStamp")),
                  "ProductId": clean_text(row.get("ProductId")),
                  "TitleId": clean_text(row.get("TitleId")),
                  "XboxProductId": clean_text(row.get("XboxProductId")),
                  "SkuId": clean_text(row.get("SkuId")),
                  "SkuDisplayName": clean_text(row.get("SkuDisplayName")),
                  "CountryName": clean_text(row.get("CountryName")),
                  "Market": clean_text(row.get("Market")),
                  "PaymentType": clean_text(row.get("PaymentType")),
                  "AcquisitionType": clean_text(row.get("AcquisitionType")),
                  "LocalCurrencyCode": clean_text(row.get("LocalCurrencyCode")),
                  "DeviceType": clean_text(row.get("DeviceType")),
                  "StoreClientName": clean_text(row.get("StoreClientName")),
                  "PurchasePriceUSDAmount": clean_text(row.get("PurchasePriceUSDAmount")),
                  "PurchasePriceLocalAmount": clean_text(row.get("PurchasePriceLocalAmount")),
              }

              raw = json.dumps(parts, sort_keys=True)
              return hashlib.sha1(raw.encode("utf-8")).hexdigest()

          def parse_report_csv(text):
              reader = csv.DictReader(io.StringIO(text))
              rows = []

              for row in reader:
                  if row:
                      rows.append({clean_text(k): clean_text(v) for k, v in row.items() if k is not None})

              return rows

          def get_access_token():
              token_url = f"https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token"

              token_response_raw = post_form(
                  token_url,
                  {
                      "client_id": client_id,
                      "client_secret": client_secret,
                      "scope": "https://manage.devcenter.microsoft.com/.default",
                      "grant_type": "client_credentials",
                  },
                  headers={"Content-Type": "application/x-www-form-urlencoded"},
              )

              token_response = json.loads(token_response_raw)
              access_token = token_response.get("access_token")

              if not access_token:
                  print(json.dumps(token_response, indent=2))
                  raise RuntimeError("Failed to get Microsoft access token.")

              return access_token

          def extract_first_value(response):
              values = response.get("value") or response.get("Value") or []

              if not isinstance(values, list) or not values:
                  return None

              return values[0]

          def get_or_create_query(token):
              queries_url = f"{BASE_URL}/consumer/insights/v1.1/ScheduledQueries"

              existing = get_json(queries_url, token)
              values = existing.get("value") or existing.get("Value") or []

              for item in values:
                  name = clean_text(item.get("name") or item.get("Name"))
                  query = clean_text(item.get("query") or item.get("Query"))
                  query_id = clean_text(item.get("queryId") or item.get("QueryId"))

                  if name == QUERY_NAME and query_id:
                      print("Using existing query:", query_id)
                      return query_id

              payload = {
                  "Query": SALES_QUERY,
                  "Name": QUERY_NAME,
                  "Description": "BLAZIN IPTV Player paid sales checker using PurchaseQuantity.",
              }

              created = post_json(queries_url, token, payload)
              item = extract_first_value(created)

              if not item:
                  print(json.dumps(created, indent=2))
                  raise RuntimeError("Microsoft did not return a queryId after creating the sales query.")

              query_id = clean_text(item.get("queryId") or item.get("QueryId"))

              if not query_id:
                  print(json.dumps(created, indent=2))
                  raise RuntimeError("Created sales query, but queryId was missing.")

              print("Created query:", query_id)
              return query_id

          def create_report(token, query_id):
              report_url = f"{BASE_URL}/consumer/insights/v1.1/ScheduledReport"

              payload = {
                  "Description": "BLAZIN IPTV Player sales check",
                  "QueryId": query_id,
                  "ReportName": f"BLAZIN Sales Check {datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S')}",
                  "executeNow": True,
              }

              created = post_json(report_url, token, payload)
              item = extract_first_value(created)

              if not item:
                  print(json.dumps(created, indent=2))
                  raise RuntimeError("Microsoft did not return a reportId after creating the report.")

              report_id = clean_text(item.get("reportId") or item.get("ReportId"))

              if not report_id:
                  print(json.dumps(created, indent=2))
                  raise RuntimeError("Created report, but reportId was missing.")

              print("Created report:", report_id)
              return report_id

          def wait_for_report_download(token, report_id):
              execution_url = f"{BASE_URL}/consumer/insights/v1.1/ScheduledReport/execution/{report_id}"

              for attempt in range(1, 31):
                  response = get_json(execution_url, token)
                  values = response.get("value") or response.get("Value") or []

                  if not isinstance(values, list):
                      print(json.dumps(response, indent=2))
                      raise RuntimeError("Unexpected report execution response format.")

                  if values:
                      item = values[0]
                      status = clean_text(item.get("executionStatus") or item.get("ExecutionStatus"))
                      secure_link = clean_text(item.get("reportAccessSecureLink") or item.get("ReportAccessSecureLink"))

                      print(f"Report status attempt {attempt}: {status or 'Unknown'}")

                      if status.lower() == "completed" and secure_link:
                          return secure_link

                      if status.lower() in {"failed", "failure", "error", "cancelled", "canceled"}:
                          print(json.dumps(response, indent=2))
                          raise RuntimeError(f"Microsoft report failed with status: {status}")

                  else:
                      print(f"Report status attempt {attempt}: waiting")

                  time.sleep(10)

              raise RuntimeError("Timed out waiting for Microsoft sales report to complete.")

          def summarize_markets(rows):
              counts = defaultdict(int)

              for row in rows:
                  qty = purchase_quantity(row)
                  if qty > 0:
                      counts[row_country(row)] += qty

              if not counts:
                  return "Unknown"

              return ", ".join(
                  f"{country}: {count}"
                  for country, count in sorted(counts.items(), key=lambda item: (-item[1], item[0]))
              )

          def summarize_new_paid_details(details):
              if not details:
                  return "None"

              lines = []

              for detail in details:
                  row = detail["row"]
                  delta = detail["delta"]

                  date_stamp = clean_text(row.get("DateStamp")) or "Unknown date"
                  title = clean_text(row.get("TitleName")) or "BLAZIN IPTV Player"
                  country = row_country(row)
                  payment_type = clean_text(row.get("PaymentType")) or "Unknown payment"
                  acquisition_type = clean_text(row.get("AcquisitionType")) or "Unknown type"
                  device_type = clean_text(row.get("DeviceType")) or "Unknown device"
                  usd = usd_amount(row)
                  local = local_amount(row)
                  currency = clean_text(row.get("LocalCurrencyCode"))

                  if usd > 0:
                      price_text = f"${usd:.2f} USD reported"
                  elif local > 0 and currency:
                      price_text = f"{local:.2f} {currency} reported"
                  elif local > 0:
                      price_text = f"{local:.2f} local amount reported"
                  else:
                      price_text = "price not reported yet"

                  lines.append(
                      f"- {delta} sale(s) | {country} | {date_stamp} | {payment_type} | {acquisition_type} | {device_type} | {price_text} | {title}"
                  )

              return "\n".join(lines)

          def main():
              now = datetime.now(timezone.utc)
              token = get_access_token()

              query_id = get_or_create_query(token)
              report_id = create_report(token, query_id)
              download_url = wait_for_report_download(token, report_id)
              csv_text = download_text(download_url)

              all_rows = parse_report_csv(csv_text)
              matching_rows = [row for row in all_rows if row_product_matches_app(row)]

              if matching_rows:
                  rows = matching_rows
                  product_filter_note = f"Matched MS_APP_ID {app_id}"
              else:
                  rows = all_rows
                  product_filter_note = (
                      f"No exact ProductId/TitleId/XboxProductId match for MS_APP_ID {app_id}; using all returned rows."
                  )

              paid_rows = [row for row in rows if is_paid_sale_row(row)]

              total_purchase_quantity = sum(purchase_quantity(row) for row in rows)
              paid_quantity_72h = sum(purchase_quantity(row) for row in paid_rows)
              paid_revenue_usd_72h = sum(usd_amount(row) for row in paid_rows)

              state = load_state()
              seen = state.get("seen_paid_row_quantities", {})

              current_paid_quantities = defaultdict(int)
              row_by_fingerprint = {}

              for row in paid_rows:
                  fingerprint = row_fingerprint(row)
                  current_paid_quantities[fingerprint] += purchase_quantity(row)
                  row_by_fingerprint[fingerprint] = row

              new_paid_sales = 0
              new_paid_details = []

              for fingerprint, qty in current_paid_quantities.items():
                  previous_qty = int(seen.get(fingerprint, 0) or 0)
                  delta = max(0, qty - previous_qty)

                  if delta > 0:
                      new_paid_sales += delta
                      new_paid_details.append({
                          "delta": delta,
                          "row": row_by_fingerprint[fingerprint],
                      })

                  seen[fingerprint] = max(previous_qty, qty)

              if len(seen) > 5000:
                  seen = dict(list(seen.items())[-5000:])

              state = {
                  "last_checked": now.isoformat(),
                  "used_api": "consumer/insights/v1.1 ScheduledReport",
                  "query_name": QUERY_NAME,
                  "report_id": report_id,
                  "window": "LAST_72_HOURS",
                  "paid_quantity_72h": paid_quantity_72h,
                  "total_purchase_quantity_72h": total_purchase_quantity,
                  "paid_revenue_usd_72h": round(paid_revenue_usd_72h, 2),
                  "seen_paid_row_quantities": seen,
              }

              save_state(state)

              print("Used API: consumer/insights/v1.1 ScheduledReport")
              print("Query name:", QUERY_NAME)
              print("Report ID:", report_id)
              print("Window: LAST_72_HOURS")
              print("Product filter:", product_filter_note)
              print("CSV rows returned:", len(all_rows))
              print("Rows used for app:", len(rows))
              print("Total purchase quantity in report:", total_purchase_quantity)
              print("Paid sales in last 72 hours:", paid_quantity_72h)
              print("New paid sales detected:", new_paid_sales)
              print("Paid revenue USD in last 72 hours:", f"${paid_revenue_usd_72h:.2f}")
              print("All purchase markets:", summarize_markets(rows))
              print("New paid sale details:")
              print(summarize_new_paid_details(new_paid_details))
              print("Raw report rows:")
              print(json.dumps(rows, indent=2))

              if new_paid_sales > 0:
                  message = (
                      "🔥 NEW BLAZIN IPTV PLAYER SALE!\n\n"
                      f"New paid sales detected: {new_paid_sales}\n"
                      f"Paid sales in last 72 hours: {paid_quantity_72h}\n"
                      f"Total purchase quantity in report: {total_purchase_quantity}\n"
                      f"Reported paid revenue in last 72 hours: ${paid_revenue_usd_72h:.2f} USD\n\n"
                      f"New paid sale details:\n{summarize_new_paid_details(new_paid_details)}\n\n"
                      "Customer name: Not provided by Microsoft Store analytics API.\n"
                      f"Checked: {now.strftime('%Y-%m-%d %H:%M UTC')}"
                  )
                  send_telegram(message)

              elif force_notify:
                  message = (
                      "✅ BLAZIN sales check completed.\n\n"
                      "No new paid sales detected.\n"
                      f"Paid sales in last 72 hours: {paid_quantity_72h}\n"
                      f"Total purchase quantity in report: {total_purchase_quantity}\n"
                      f"Reported paid revenue in last 72 hours: ${paid_revenue_usd_72h:.2f} USD\n"
                      f"All purchase markets: {summarize_markets(rows)}\n"
                      "Customer name: Not provided by Microsoft Store analytics API.\n"
                      f"Checked: {now.strftime('%Y-%m-%d %H:%M UTC')}"
                  )
                  send_telegram(message)

          main()
          PY

      - name: Save sales state
        shell: bash
        run: |
          if git diff --quiet -- .github/state/blazin_sales_state.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/state/blazin_sales_state.json
          git commit -m "Update BLAZIN sales check state"
          git push