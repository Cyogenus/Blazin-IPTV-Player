name: BLAZIN Sales Check

on:
  workflow_dispatch:
    inputs:
      notify_even_if_no_new_sales:
        description: "Send Telegram message even if no new activity?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  check-sales:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Microsoft Store acquisitions
        shell: bash
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_APP_ID: ${{ secrets.MS_APP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ inputs.notify_even_if_no_new_sales || 'false' }}
        run: |
          set -e
          mkdir -p .github/state

          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          STATE_FILE = ".github/state/blazin_sales_state.json"

          tenant_id = os.environ["MS_TENANT_ID"]
          client_id = os.environ["MS_CLIENT_ID"]
          client_secret = os.environ["MS_CLIENT_SECRET"]
          app_id = os.environ["MS_APP_ID"]
          telegram_token = os.environ["TELEGRAM_BOT_TOKEN"]
          telegram_chat_id = os.environ["TELEGRAM_CHAT_ID"]
          force_notify = os.environ.get("FORCE_NOTIFY", "false").lower() == "true"

          def post_form(url, data, headers=None):
              encoded = urllib.parse.urlencode(data).encode("utf-8")
              req = urllib.request.Request(url, data=encoded, headers=headers or {}, method="POST")
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read().decode("utf-8")

          def get_json(url, token):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                  },
                  method="GET",
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def send_telegram(text):
              post_form(
                  f"https://api.telegram.org/bot{telegram_token}/sendMessage",
                  {"chat_id": telegram_chat_id, "text": text},
              )

          def load_state():
              if not os.path.exists(STATE_FILE):
                  return {
                      "date_checked_utc": None,
                      "last_paid_total": 0,
                      "last_trial_total": 0,
                      "last_free_total": 0,
                      "last_total_acquisitions": 0,
                  }
              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  return json.load(f)

          def save_state(state):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(state, f, indent=2, sort_keys=True)

          def row_quantity(row):
              try:
                  return int(row.get("acquisitionQuantity") or 0)
              except Exception:
                  return 0

          def row_price(row):
              try:
                  usd = float(row.get("purchasePriceUSDAmount") or 0)
                  local = float(row.get("purchasePriceLocalAmount") or 0)
                  return max(usd, local)
              except Exception:
                  return 0.0

          def acquisition_type(row):
              return str(row.get("acquisitionType", "")).strip().lower()

          def is_paid_row(row):
              return row_price(row) > 0 or acquisition_type(row) in {
                  "paid",
                  "purchase",
                  "initial purchase",
                  "in-app purchase",
              }

          def is_trial_row(row):
              return acquisition_type(row) == "trial"

          def is_free_row(row):
              return not is_paid_row(row) and not is_trial_row(row)

          now = datetime.now(timezone.utc)
          today_utc = now.strftime("%Y-%m-%d")
          start_date = now.strftime("%-m/%-d/%Y")
          end_date = now.strftime("%-m/%-d/%Y")

          token_response_raw = post_form(
              f"https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token",
              {
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "scope": "https://manage.devcenter.microsoft.com/.default",
                  "grant_type": "client_credentials",
              },
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )

          token_response = json.loads(token_response_raw)
          access_token = token_response.get("access_token")

          if not access_token:
              print(json.dumps(token_response, indent=2))
              raise SystemExit("Failed to get Microsoft access token.")

          query = {
              "applicationId": app_id,
              "startDate": start_date,
              "endDate": end_date,
              "aggregationLevel": "day",
              "groupby": "date,applicationName,acquisitionType,market,deviceType,storeClient,osVersion",
          }

          api_url = (
              "https://manage.devcenter.microsoft.com/v1.0/my/analytics/acquisitions?"
              + urllib.parse.urlencode(query)
          )

          data = get_json(api_url, access_token)
          rows = data.get("Value") or data.get("value") or []

          if not isinstance(rows, list):
              print(json.dumps(data, indent=2))
              raise SystemExit("Unexpected Microsoft acquisitions response format.")

          total_acquisitions = sum(row_quantity(row) for row in rows)
          paid_total = sum(row_quantity(row) for row in rows if is_paid_row(row))
          trial_total = sum(row_quantity(row) for row in rows if is_trial_row(row))
          free_total = sum(row_quantity(row) for row in rows if is_free_row(row))

          state = load_state()

          if state.get("date_checked_utc") != today_utc:
              previous_paid_total = 0
              previous_trial_total = 0
              previous_free_total = 0
              previous_total_acquisitions = 0
          else:
              previous_paid_total = int(state.get("last_paid_total", 0))
              previous_trial_total = int(state.get("last_trial_total", 0))
              previous_free_total = int(state.get("last_free_total", 0))
              previous_total_acquisitions = int(state.get("last_total_acquisitions", 0))

          new_paid_sales = max(0, paid_total - previous_paid_total)
          new_trials = max(0, trial_total - previous_trial_total)
          new_free = max(0, free_total - previous_free_total)
          new_total = max(0, total_acquisitions - previous_total_acquisitions)

          save_state({
              "date_checked_utc": today_utc,
              "last_checked": now.isoformat(),
              "last_paid_total": paid_total,
              "last_trial_total": trial_total,
              "last_free_total": free_total,
              "last_total_acquisitions": total_acquisitions,
          })

          print("Rows returned:", len(rows))
          print("Paid sales today:", paid_total)
          print("Trials today:", trial_total)
          print("Free/other acquisitions today:", free_total)
          print("Total acquisitions today:", total_acquisitions)
          print("New paid sales:", new_paid_sales)
          print("New trials:", new_trials)
          print("New free/other:", new_free)

          if rows:
              print("DEBUG: Sample row:", json.dumps(rows[0], indent=2))

          if new_paid_sales > 0:
              send_telegram(
                  "🔥 NEW BLAZIN IPTV PLAYER PAID SALE!\n\n"
                  f"New paid sales: {new_paid_sales}\n"
                  f"Paid sales today: {paid_total}\n"
                  f"Trials today: {trial_total}\n"
                  f"Total acquisitions today: {total_acquisitions}\n"
                  f"Checked: {now.strftime('%Y-%m-%d %H:%M UTC')}"
              )

          elif new_trials > 0 or new_free > 0:
              send_telegram(
                  "📥 NEW BLAZIN IPTV PLAYER ACQUISITION!\n\n"
                  f"New trials: {new_trials}\n"
                  f"New free/other acquisitions: {new_free}\n"
                  f"Trials today: {trial_total}\n"
                  f"Paid sales today: {paid_total}\n"
                  f"Total acquisitions today: {total_acquisitions}\n"
                  f"Checked: {now.strftime('%Y-%m-%d %H:%M UTC')}"
              )

          elif force_notify:
              send_telegram(
                  "✅ BLAZIN sales check completed.\n\n"
                  "No new activity detected.\n"
                  f"Paid sales today: {paid_total}\n"
                  f"Trials today: {trial_total}\n"
                  f"Free/other acquisitions today: {free_total}\n"
                  f"Total acquisitions today: {total_acquisitions}\n"
                  f"Rows returned: {len(rows)}\n"
                  f"Checked: {now.strftime('%Y-%m-%d %H:%M UTC')}"
              )
          PY

      - name: Save sales state
        shell: bash
        run: |
          if git diff --quiet .github/state/blazin_sales_state.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/state/blazin_sales_state.json
          git commit -m "Update BLAZIN sales check state"
          git push