name: Bing Copy Polish

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/polish-bing-copy.mjs"
      - "scripts/check-bing-copy.mjs"
      - ".github/workflows/bing-copy-polish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check scripts
        run: |
          node --check scripts/polish-bing-copy.mjs
          node --check scripts/check-bing-copy.mjs

      - name: Polish preferred pages
        run: node scripts/polish-bing-copy.mjs

      - name: Validate preferred-page copy
        run: node scripts/check-bing-copy.mjs

      - name: Commit copy cleanup
        shell: bash
        run: |
          if git diff --quiet -- docs; then
            echo "No copy changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Polish preferred pages for Bing quality [skip ci]"
          git push
