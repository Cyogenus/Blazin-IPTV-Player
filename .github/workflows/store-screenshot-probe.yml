name: Store Screenshot Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/store-screenshot-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect Microsoft Store TV Mode images
        shell: python
        run: |
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          product_url = "https://storeedgefd.dsx.mp.microsoft.com/v9.0/products/9NQ5S0FFCN8T?market=US&locale=en-us&deviceFamily=Windows.Desktop"
          req = urllib.request.Request(product_url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          targets = {
              "TV Mode — Live TV + EPG",
              "TV Mode — Movies",
              "TV Mode — Series",
          }
          records = []
          for image in data.get("Payload", {}).get("Images", []):
              if image.get("Caption") not in targets:
                  continue
              image_url = image.get("Url")
              req = urllib.request.Request(image_url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  content_type = response.headers.get("Content-Type")
              records.append({
                  "caption": image.get("Caption"),
                  "position": image.get("ImagePositionInfo"),
                  "width": image.get("Width"),
                  "height": image.get("Height"),
                  "url": image_url,
                  "content_type": content_type,
                  "byte_length": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "magic_hex": raw[:16].hex(),
              })

          Path("scripts/store-screenshot-metadata.json").write_text(
              json.dumps(records, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(records, indent=2, ensure_ascii=False))
      - name: Commit metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/store-screenshot-metadata.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Inspect Microsoft Store TV Mode screenshots [skip ci]"
          git push
