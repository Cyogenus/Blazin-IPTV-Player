name: Store Screenshot Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/store-screenshot-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read Microsoft Store image metadata
        shell: python
        run: |
          import json
          import urllib.request
          from pathlib import Path

          url = "https://storeedgefd.dsx.mp.microsoft.com/v9.0/products/9NQ5S0FFCN8T?market=US&locale=en-us&deviceFamily=Windows.Desktop"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          records = []
          def walk(value, path="root"):
              if isinstance(value, dict):
                  lowered = {str(k).lower(): k for k in value}
                  url_keys = [k for lk, k in lowered.items() if "uri" in lk or "url" in lk]
                  has_url = any(isinstance(value.get(k), str) and ("//" in value.get(k) or value.get(k).startswith("http")) for k in url_keys)
                  interesting = any(any(word in lk for word in ("image", "purpose", "width", "height", "caption")) for lk in lowered)
                  if has_url and interesting:
                      slim = {"path": path, "keys": list(value.keys())}
                      for k, v in value.items():
                          lk = str(k).lower()
                          if isinstance(v, (str, int, float, bool, type(None))) and any(word in lk for word in ("uri", "url", "image", "purpose", "width", "height", "caption")):
                              slim[k] = v
                      records.append(slim)
                  for k, child in value.items():
                      walk(child, f"{path}.{k}")
              elif isinstance(value, list):
                  for i, child in enumerate(value):
                      walk(child, f"{path}[{i}]")
          walk(data)

          probe = {
              "top_level_keys": list(data.keys()) if isinstance(data, dict) else None,
              "payload_keys": list(data.get("Payload", {}).keys()) if isinstance(data, dict) and isinstance(data.get("Payload"), dict) else None,
              "records": records,
          }
          Path("scripts/store-screenshot-metadata.json").write_text(
              json.dumps(probe, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(probe, indent=2, ensure_ascii=False))
      - name: Commit metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/store-screenshot-metadata.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Probe Microsoft Store image metadata [skip ci]"
          git push
