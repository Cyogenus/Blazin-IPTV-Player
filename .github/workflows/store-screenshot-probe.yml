name: Install Sharp TV Mode Screenshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/store-screenshot-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact Microsoft Store TV Mode screenshots
        shell: python
        run: |
          import json
          import urllib.request
          from pathlib import Path

          product_url = "https://storeedgefd.dsx.mp.microsoft.com/v9.0/products/9NQ5S0FFCN8T?market=US&locale=en-us&deviceFamily=Windows.Desktop"
          req = urllib.request.Request(product_url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          targets = {
              "TV Mode — Live TV + EPG": "tv-mode-live-tv-epg-v3.jpg",
              "TV Mode — Movies": "tv-mode-movies-v2.jpg",
              "TV Mode — Series": "tv-mode-series-v2.jpg",
          }
          images = {img.get("Caption"): img for img in data.get("Payload", {}).get("Images", [])}
          out_dir = Path("docs/screenshots")
          out_dir.mkdir(parents=True, exist_ok=True)

          for caption, filename in targets.items():
              image = images.get(caption)
              if not image:
                  raise RuntimeError(f"Microsoft Store screenshot not found: {caption}")
              image_url = image.get("Url")
              req = urllib.request.Request(image_url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  content_type = (response.headers.get("Content-Type") or "").lower()
              if content_type != "image/jpeg" or not raw.startswith(b"\xff\xd8\xff"):
                  raise RuntimeError(f"Unexpected image format for {caption}: {content_type}")
              output = out_dir / filename
              output.write_bytes(raw)
              print(f"Downloaded {caption}: {image.get('Width')}x{image.get('Height')} -> {output} ({len(raw)} bytes)")
      - name: Commit sharp TV Mode screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/tv-mode-live-tv-epg-v3.jpg docs/screenshots/tv-mode-movies-v2.jpg docs/screenshots/tv-mode-series-v2.jpg
          if git diff --cached --quiet; then
            echo "Sharp TV Mode screenshots are already current."
            exit 0
          fi
          git commit -m "Add full-resolution TV Mode screenshots [skip ci]"
          git push
